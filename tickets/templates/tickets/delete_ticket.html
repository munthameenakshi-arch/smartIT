<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Delete Ticket</title>

</head>

<body>

    <h1>Delete Ticket</h1>

    <p>
        Are you sure you want to delete this ticket?
    </p>

    <h2>
        {{ ticket.title }}
    </h2>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete Ticket
        </button>

    </form>

    <br>

    <a href="{% url 'ticket_detail' ticket.id %}">
        Cancel
    </a>

</body>

</html>
