<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Ticket</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1f3f91;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            background-color: #1f3f91;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163276;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #1f3f91;
            text-decoration: none;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Create IT Support Ticket</h1>

        <form method="POST">

            {% csrf_token %}

            <label for="title">Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter ticket title"
                required
            >

            <label for="description">Description</label>

            <textarea
                id="description"
                name="description"
                placeholder="Describe your problem"
                required
            ></textarea>

            <label for="priority">Priority</label>

            <select
                id="priority"
                name="priority"
                required
            >

                <option value="">Select Priority</option>

                <option value="Low">
                    Low
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="High">
                    High
                </option>

                <option value="Critical">
                    Critical
                </option>

            </select>

            <button type="submit">
                Submit Ticket
            </button>

        </form>

        <a
            href="{% url 'dashboard' %}"
            class="back-link"
        >
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
